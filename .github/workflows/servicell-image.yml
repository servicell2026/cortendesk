# SERVICELL build of the CortenDesk image (Client Builder + Enrollment Keys).
#
# Every push to main publishes ghcr.io/<owner>/cortendesk:servicell (and a
# :servicell-<sha> tag to roll back to). amd64 only: the QNAP is x86_64.
#
# The first time, make the package public (GitHub → your profile → Packages →
# cortendesk → Package settings → Change visibility), or add ghcr.io with a
# read:packages token under Container Station → Registries.
name: SERVICELL image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: servicell-image
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/cortendesk" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:servicell
            ${{ steps.name.outputs.image }}:servicell-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
